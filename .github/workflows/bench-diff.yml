name: bench-diff
on:
  push:
  # Forks only (see the job condition): same-repo PRs are covered by the push trigger.
  # Runs with a read-only token and no secrets, so fork code never gets write access.
  pull_request:

permissions:
  contents: read

jobs:
  run-benchdiff:
    runs-on: ubuntu-latest
    # Branches (push) or forked PRs. Same-repo PRs already run on push for the same sha.
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.fork == true
    permissions:
      checks: write
    steps:
    - name: Get sha commit
      id: event
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_SHA: ${{ github.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        echo "DEBUG: event type(${EVENT_NAME})"
        ref="${EVENT_SHA}"
        if [ "${EVENT_NAME}" = "pull_request" ] ; then
          ref="${PR_HEAD_SHA}"
        fi
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ steps.event.outputs.ref }}
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    # Version: https://github.com/WillAbides/benchdiff-action/releases/tag/v0.3.5
    - uses: WillAbides/benchdiff-action@990b4c50b5420b485bf87e42c9f18234eba76fbc
      id: benchdiff
      with:
        benchdiff_version: 0.9.1
        # Forks get a read-only token: skip the check-run and use the job summary instead.
        report_status: ${{ github.event_name == 'push' }}
        status_sha: ${{ steps.event.outputs.ref }}
        status_name: benchdiff-result
        status_on_degraded: neutral
        # See https://github.com/WillAbides/benchdiff
        benchdiff_args: |
          --base-ref=origin/main
          --cpu=1,2
          --count=5
          --warmup-count=1
          --warmup-time=10ms
          --benchtime=100ms
          --tolerance=20
          --benchmem
          --debug
    - name: Publish benchstat to job summary
      if: always() && steps.benchdiff.outputs.benchstat_output != ''
      env:
        BENCHSTAT_OUTPUT: ${{ steps.benchdiff.outputs.benchstat_output }}
      run: |
        {
          echo "### benchdiff"
          echo
          printf '%s\n' "$BENCHSTAT_OUTPUT"
        } >> "$GITHUB_STEP_SUMMARY"
